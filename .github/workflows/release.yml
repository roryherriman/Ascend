name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    name: Build Windows portable and upload release asset
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt
          pip install pytest pytest-qt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q --tb=short

      - name: Generate version info
        run: python scripts/generate_version_info.py

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm Ascend.spec

      - name: Package ZIP
        shell: pwsh
        run: |
          $VERSION = python -c "from ascend.metadata import APP_VERSION; print(APP_VERSION)"
          $ARCHIVE = "Ascend-Portable-$VERSION.zip"
          Compress-Archive -Path "dist\Ascend\*" -DestinationPath $ARCHIVE -Force
          $HASH = (Get-FileHash $ARCHIVE -Algorithm SHA256).Hash
          Write-Output "ARCHIVE=$ARCHIVE" >> $env:GITHUB_ENV
          Write-Output "SHA256=$HASH" >> $env:GITHUB_ENV

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          body: |
            ## Ascend ${{ github.ref_name }}

            **SHA-256:** `${{ env.SHA256 }}  ${{ env.ARCHIVE }}`

            ### Installation
            1. Download `${{ env.ARCHIVE }}`
            2. Extract to any folder
            3. Run `Ascend.exe`

            *Ascend is an independent, unofficial tool — not affiliated with Blizzard Entertainment or Warcraft Logs.*
